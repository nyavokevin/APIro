[package]
name = "apiforge"
version = "0.1.0"
default-run = "apiforge"
description = "APIForge — the anti-Postman API client"
license = "MIT"
edition = "2021"

[lib]
name = "apiforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "apiforge-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "brotli",
  "deflate",
  "rustls-tls",
  "stream",
  "multipart",
  "cookies",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
glob = "0.3"
walkdir = "2"
axum = { version = "0.7", features = ["macros", "json"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
